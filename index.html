<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#EEF2F9" media="(prefers-color-scheme: light)">
  <meta name="description" content="Your FIFA World Cup 2026 tournament command center. 105 matches, 48 teams, offline-first PWA.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CupVerse">
  <link rel="manifest" href="manifest.json">
  <title>CupVerse – World Cup 2026</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div id="splash" class="splash-screen">
    <div class="splash-inner">
      <div class="splash-logo">CupVerse</div>
      <div class="splash-sub">World Cup 2026 Command Center</div>
      <div class="spinner"></div>
    </div>
  </div>

  <div id="offline-banner" class="offline-banner hidden">
    📡 Offline – displaying cached data
  </div>

  <div id="update-banner" class="update-banner hidden" role="alert" aria-live="polite">
    <div class="update-banner-inner">
      <div class="update-banner-text">
        <div class="update-banner-title">WC 2026 Data Update Available</div>
        <div class="update-banner-msg">Please close the app / tab and reload to get the latest.</div>
      </div>
      <div class="update-banner-actions">
        <button class="update-now-btn" data-action="update-now">Reload Now</button>
        <button class="update-dismiss-btn" data-action="dismiss-update" aria-label="Dismiss update">✕</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">CupVerse ⚽</div>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="#home"      class="nav-link">Home</a>
      <a href="#matches"   class="nav-link">Fixtures</a>
      <a href="#standings" class="nav-link">Standings</a>
      <a href="#teams"     class="nav-link">Teams</a>
      <a href="#venues"    class="nav-link">Venues</a>
      <a href="#calendar"  class="nav-link">Calendar</a>
      <a href="#scorers"   class="nav-link">Scorers</a>
      <a href="#settings"  class="nav-link">Settings</a>
    </nav>
  </header>

  <main id="app" class="app-shell" role="main"></main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-items">
      <a href="#home"      class="bottom-nav-item" data-page="home">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10 12 3l8.5 7"/><path d="M5.5 9v10a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1V9"/></svg></span>
        <span class="bottom-nav-label">Home</span>
      </a>
      <a href="#calendar"  class="bottom-nav-item" data-page="calendar">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg></span>
        <span class="bottom-nav-label">Calendar</span>
      </a>
      <a href="#standings" class="bottom-nav-item" data-page="standings">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="13" width="4" height="8" rx="1.2"/><rect x="10" y="7" width="4" height="14" rx="1.2"/><rect x="16" y="3" width="4" height="18" rx="1.2"/></svg></span>
        <span class="bottom-nav-label">Standings</span>
      </a>
      <a href="#teams"     class="bottom-nav-item" data-page="teams">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.3 20v-1.2a5.7 5.7 0 0 1 11.4 0V20"/><circle cx="17.2" cy="9.2" r="2.4"/><path d="M15.6 13.4a4.6 4.6 0 0 1 5.1 4.6V20"/></svg></span>
        <span class="bottom-nav-label">Teams</span>
      </a>
      <a href="#venues"    class="bottom-nav-item" data-page="venues">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg></span>
        <span class="bottom-nav-label">Venues</span>
      </a>
      <a href="#settings"  class="bottom-nav-item" data-page="settings">
        <span class="bottom-nav-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.2M12 18.3v3.2M21.5 12h-3.2M5.7 12H2.5M18.6 5.4l-2.3 2.3M7.7 16.3l-2.3 2.3M18.6 18.6l-2.3-2.3M7.7 7.7 5.4 5.4"/></svg></span>
        <span class="bottom-nav-label">Settings</span>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
